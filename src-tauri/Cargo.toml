[package]
name = "sql-pro"
version = "0.1.0"
description = "A compact SQL client for MySQL, PostgreSQL and SQLite"
authors = ["Zin Kyaw Kyaw"]
edition = "2024"
rust-version = "1.85"

[lib]
# The `_lib` suffix keeps the lib name different from the bin name.
# Windows needs this, see https://github.com/rust-lang/cargo/issues/8519
name = "sql_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
# sqlx is a driver toolkit, not an ORM. We write all SQL by hand.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "mysql",
    "postgres",
    "sqlite",
] }
async-trait = "0.1"
futures-util = "0.3"
thiserror = "2"
parking_lot = "0.12"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
# Runs the system ssh program for tunnels.
tokio = { version = "1", features = ["process", "net", "time", "io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
