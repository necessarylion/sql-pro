[package]
name = "sql-pro"
version = "0.6.1"
description = "A compact SQL client for MySQL, PostgreSQL and SQLite"
authors = ["Zin Kyaw Kyaw"]
edition = "2024"
rust-version = "1.99"

[lib]
# The `_lib` suffix keeps the lib name different from the bin name.
# Windows needs this, see https://github.com/rust-lang/cargo/issues/8519
name = "sql_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# sqlx is a driver toolkit, not an ORM. We write all SQL by hand.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "mysql",
    "postgres",
    "sqlite",
] }
async-trait = "0.1"
futures-util = "0.3"
thiserror = "2"
parking_lot = "0.12"
# The OS password store: Keychain on macOS, Credential Manager on Windows,
# and the Secret Service (GNOME Keyring, KWallet) over D-Bus on Linux.
# Version 4 finds the same items as version 3, so saved passwords stay.
keyring = "4"
# Runs the system ssh program for tunnels.
tokio = { version = "1", features = ["process", "net", "time", "io-util"] }
tauri-plugin-updater = "2"

# Windows and Linux have no Dock. There the tray icon brings a hidden window back,
# and a second start of the app shows the window of the first one.
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
