version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    ignore:
      # The `tauri*` crates and the `@tauri-apps/*` npm packages must keep the same
      # minor version. They are updated together by hand.
      - dependency-name: 'tauri*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Same reason as above: the minor version must match the Rust crates.
      - dependency-name: '@tauri-apps/*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
