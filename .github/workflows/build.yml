name: build

# Builds the installers for macOS, Windows and Linux, on Intel and ARM chips.
#
# - Start it by hand (Actions tab, or `gh workflow run build.yml`):
#   the installers are kept as workflow artifacts. No release is made.
# - Push a tag like `v0.1.0`: a release is made with all installers attached.
#   The tag must match the version in `src-tauri/tauri.conf.json`.
#   The release starts as a draft. The `publish` job publishes it when all builds pass.
#   If a build fails, the release stays a draft. Fix it, or publish it by hand.
#
# Auto update:
# - Each build adds its update files and their `.sig` files to the release.
# - The builds do NOT make `latest.json`. Six jobs writing one file at the same time
#   lose entries. The `publish` job makes it once, from the `.sig` files, with
#   `.github/scripts/latest-json.sh`. It fails if a platform is missing.
# - The app reads `releases/latest`. A draft is not the latest release.
#   So users only get the update after the `publish` job has run.
# - The app compares its own version with the one in `latest.json`. That one comes
#   from the tag. The file names come from `tauri.conf.json`. So the two must match:
#   raise the version there before you tag.
# - The update files are signed with the updater key. The secret
#   TAURI_SIGNING_PRIVATE_KEY must be set in the repository, or the build fails.
#
# The installers are NOT code signed. macOS shows a Gatekeeper warning and Windows shows
# a SmartScreen warning. To sign, add the secrets to the repository and pass them
# in the `env` of the "Build the installers" step:
# - macOS: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
# - Windows: see https://tauri.app/distribute/sign/windows/

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Jobs get write access only where they need it.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    permissions:
      # Needed to make the draft release.
      contents: write
    strategy:
      # One broken target must not stop the others.
      fail-fast: false
      matrix:
        include:
          # macOS: one ARM runner builds both. Makes .app and .dmg.
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          # Windows: makes .msi and a setup .exe.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          # Linux: makes .deb, .rpm and .AppImage.
          # Ubuntu 22.04 is used so the app also starts on older systems.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the Linux packages
        if: runner.os == 'Linux'
        # All of these are for Tauri. libdbus-1-dev is for the tao crate.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libdbus-1-dev

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # Needed because the action is pinned to a commit, not to the `stable` branch.
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: bun install --frozen-lockfile

      - name: Build the installers
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files. The key has no password.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          args: --target ${{ matrix.target }}
          # A tag makes a draft release. With no tag name, no release is made.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: SQL Pro ${{ github.ref_name }}
          # Keep this a draft on purpose. The six jobs upload their files one by one.
          # The app reads the latest release, so it must not see a release that is
          # only half filled. The `publish` job publishes it at the end.
          releaseDraft: true
          # Do not upload `latest.json` here. The six jobs would overwrite each other
          # and lose platforms. The `publish` job makes it once.
          uploadUpdaterJson: false
          # The `.sig` files are still needed. The `publish` job reads them.
          uploadUpdaterSignatures: true
          # A run started by hand keeps the installers as workflow artifacts.
          uploadWorkflowArtifacts: ${{ github.ref_type != 'tag' }}

  publish:
    name: publish the release
    # Runs only when all six builds passed. If one failed, the release stays a draft.
    needs: build
    # A run started by hand makes no release, so there is nothing to publish.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      # Needed to change the release.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Make latest.json for the auto update
        # Must run before the release is published, so users never see a release without it.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          bash .github/scripts/latest-json.sh "$TAG" > latest.json
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber

      - name: Fill the release notes
        # Only when the release body is empty. Notes written by hand are kept.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          if [ -z "$body" ]; then
            notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" --jq .body)
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$notes"
          fi

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Update the Homebrew cask
        # Writes the new version and checksums into Casks/sql-pro.rb in necessarylion/homebrew-tap.
        # HOMEBREW_TAP_TOKEN is a fine-grained token with Contents read and write on that repo only.
        # Without the secret, this step only prints a notice. The release is already public.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set. The Homebrew cask was not updated."
            exit 0
          fi
          version="${TAG#v}"
          dir="$RUNNER_TEMP/cask"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.dmg' --dir "$dir/dmg"
          arm=$(sha256sum "$dir/dmg/SQL.Pro_${version}_aarch64.dmg" | cut -d' ' -f1)
          intel=$(sha256sum "$dir/dmg/SQL.Pro_${version}_x64.dmg" | cut -d' ' -f1)

          # git asks gh for the password, and gh reads it from GH_TOKEN. So the token is never on a command line.
          export GH_TOKEN="$TAP_TOKEN"
          gh auth setup-git
          git clone https://github.com/necessarylion/homebrew-tap.git "$dir/tap"
          cd "$dir/tap"
          sed -i -E \
            -e "s/^(  version )\"[^\"]*\"/\1\"$version\"/" \
            -e "s/(arm: +)\"[0-9a-f]{64}\"/\1\"$arm\"/" \
            -e "s/(intel: +)\"[0-9a-f]{64}\"/\1\"$intel\"/" \
            Casks/sql-pro.rb
          if git diff --quiet; then
            echo "The cask already has version $version."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update sql-pro to $version"
          git push
